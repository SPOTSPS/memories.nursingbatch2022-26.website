<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* 1. பிரவுசரின் டீஃபால்ட் இடைவெளிகளை நீக்குதல் */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* தேவையற்ற ஸ்க்ரோல் பாரை தவிர்க்க */
            background-color: #f4f4f4;
        }

        /* 2. Iframe-ஐ ஸ்கிரீன் முழுவதும் கச்சிதமாகப் பொருத்துதல் */
        .responsive-iframe {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
            border: none; /* பார்டர் கோடுகளை நீக்க */
        }
    </style>
</head>
<body>

    <iframe 
        src="https://script.google.com/macros/s/AKfycbxkTkGq_8jTZrD9MCZQgv37NHSj-lmt6JCrfeoAVT6EEtU94ObSK80fb0bA9nGV3pk-SQ/exec"
