<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sirius Guys B.Sc Nursing Final Year</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f4; }
        #content-area { display: none; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        h2 { color: #28a745; }
    </style>
</head>
<body>

    <div id="content-area">
        <h2>✅ TMIS டேட்டா வெற்றிகரமாக இணைக்கப்பட்டது!</h2>
        <p>சர்வரில் இருந்து தரவுகள் எந்த பிழையும் இல்லாமல் வந்துவிட்டன.</p>
        <p style="color: red; font-size: 14px;">(குறிப்பு: உங்களின் முழுமையான டிசைன் இங்கே வர வேண்டும்)</p>
    </div>

    <script>
        // 1. பக்கம் ஓபன் ஆனவுடனே SweetAlert2 லோடிங் சுற்ற ஆரம்பிக்கும்
        Swal.fire({
            title: 'தரவுகள் ஏற்றப்படுகின்றன...',
            text: 'தயவுசெய்து காத்திருக்கவும்',
            allowOutsideClick: false,
            didOpen: () => {
                Swal.showLoading();
            }
        });

        // 2. நீங்கள் கொடுத்த புதிய API லிங்க்
        const scriptURL = "https://script.google.com/macros/s/AKfycbxqcbbvZPnrMfzqz73b9Z5ovAoons3pAHjavHScFEh0OmRbjFBVZhfFm25H2CNLAQvC/exec";

        // 3. Fetch API மூலம் டேட்டாவை வாங்குதல்
        fetch(scriptURL)
            .then(response => response.json())
            .then(data => {
                // டேட்டா வந்தவுடன் லோடிங்கை நிறுத்துகிறோம்
                Swal.close();
                
                // டேட்டாவை கன்சோலில் செக் செய்ய (F12)
                console.log("கிடைத்த டேட்டா:", data);

                // டிசைனை திரையில் காட்டுகிறோம்
                document.getElementById('content-area').style.display = 'block';

                /* இந்த இடத்தில் தான் data.students, data.photos, 
                   data.faculty போன்ற தகவல்களை உங்களின் டிசைனுக்குள் செலுத்த வேண்டும்.
                */
            })
            .catch(error => {
                Swal.fire('பிழை!', 'சர்வரைத் தொடர்புகொள்வதில் சிக்கல். மீண்டும் முயற்சிக்கவும்.', 'error');
            });
    </script>

</body>
</html>
