<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Sirius Guys B.sc Nursing Final Year</title>
  
  <style>
    /* 2. பக்கம் முழுவதும் இடமில்லாமல் நிரப்புவதற்கான ஸ்டைல் */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden; /* தேவையில்லாத ஸ்க்ரோல் பாரை மறைக்க */
      background-color: #000; /* பின்னணி கருப்பு */
    }

    /* 3. Iframe அமைப்புகள் (மொபைல், டிவி, லேப்டாப் அனைத்திற்கும் பொருந்தும்) */
    .responsive-iframe {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      width: 100%;
      height: 100%;
      border: none; /* பார்டர் கோடுகளை நீக்க */
    }
  </style>
</head>
<body>

  <iframe 
    src="https://script.google.com/macros/s/AKfycbyjcJurNUtsiFbDAYuYwibJnK2cFLZ9VOrn8Whph29hFNAcvSk6me1BuSfYHZ5R9Ck2jQ/exec" 
    class="responsive-iframe" 
    allowfullscreen
    title="TMIS Portal">
  </iframe>

</body>
</html>
